# Fabric Vitals — Fabric Spec Sheet (template, v0.2 draft)
#
# What this file is. It is the fabric owner's declaration: how the fabric is
# built, and what it promises to deliver. Fabric Vitals then measures the fabric
# against these promises.
# Fill this in BEFORE measurement. Field IDs (S1–S23) match the field table in
# SPEC_SHEET.md, which explains each field in full. See SPEC_SHEET.md §2.
# Every field is declared by the fabric's owner, the party accountable for the
# fabric. Leave nothing blank: use "not-applicable" only where SPEC_SHEET.md
# allows it.
# This template contains no values. Any value you enter is your fabric's promise.

S22_version:                      # who declares this sheet, when, and against which Rulebook
  spec_sheet_version: ""          # e.g. your own version string; a change to any field below needs a new one
  date: ""                        # YYYY-MM-DD
  signer: ""                      # the person or role accountable for the declaration
  rulebook_version: "RB-0.2"      # the Rulebook (the fixed rules for measuring and judging every fabric, RULEBOOK.md) this sheet is declared against

# ---------------------------------------------------------------- Identity
S1_fabric_scope:                  # what the sheet covers
  scope_id: ""
  inventory_ref: ""               # where the list of switches, links and NIC ports in scope is kept (NIC: network interface card, the network adapter in each server)
  job_bearing_capacity_ref: ""    # which of that capacity carries accelerator jobs (the "job-bearing" capacity)

S23_scoring_scope:                # the unit within which jobs run (a pod or scalable unit); each scope gets its own score
  - scope_id: ""
    inventory_ref: ""             # the part of the S1 inventory that lies inside this scope

S2_purpose:
  purpose: ""                     # what the fabric is for: training | inference | mixed
  scoring_profile: ""             # the workload profile it is scored under: TRAINING | INFERENCE | GENERAL (a mixed fabric names one)

# ---------------------------------------------------------------- Build
S3_topology:
  shape: ""                       # clos | rail-optimized | rail-only | multi-plane
  tiers: ""                       # how many switch tiers the fabric has
  designed_paths_ref: ""          # where the designed paths between endpoint pairs are documented

S4_host_attachment: ""            # how each accelerator NIC connects: single-homed (one leaf) | dual-homed (two distinct leaves) | multi-plane (K_planes independent planes)

S5_uplinks_and_subscription:
  subscription_ratio: ""          # leaf uplink capacity divided by leaf downlink capacity
  disjoint_paths_per_tier: ""     # how many equal-cost paths that share no link exist per tier

S6_planes:
  count: ""                       # the number of independent planes (parallel copies of the fabric)
  nic_port_to_plane_ref: ""       # where the mapping of NIC ports to planes is documented

S7_transport_and_load_distribution:
  transport: ""                   # e.g. RoCEv2 (RDMA over Converged Ethernet, version two) | UET (Ultra Ethernet Transport) | InfiniBand
  congestion_control_mode: ""     # e.g. DCQCN (Data Center Quantized Congestion Notification) on | off
  load_distribution: ""           # flow-hashing (each flow keeps to one path) | packet-spraying (a flow's packets are spread over many paths)

S8_lossless_transport_configuration:   # one entry per lossless traffic class (a class carried without dropping packets); declared once, for switches and NICs alike
  - traffic_class: ""
    pfc_enabled_priorities: []    # the priorities on which PFC is enabled (PFC: priority flow control, the pause mechanism of lossless Ethernet)
    ecn_marking_configuration: "" # the ECN marking settings (ECN: explicit congestion notification, a mark that tells senders to slow down before packets are lost)
    dscp_to_traffic_class_mapping: {}   # how DSCP values map to traffic classes (DSCP: differentiated services code point, the packet-header field that names a packet's traffic class)
    mtu: ""                       # the MTU (maximum transmission unit): the largest packet the path carries
    applies_to: ["switches", "nics"]

S9_physical_diversity:
  cabling_availability_class: ""  # the cabling availability class of the links between cabinets

# ---------------------------------------------------------------- Resilience promise
S10_failures_ridden_through:      # the failures the fabric absorbs without losing job-bearing capacity
  per_tier:                       # K_k(tier): the number of link or switch failures happening at once that the tier absorbs
    - tier: ""
      concurrent_failures: ""
      residual_capacity: ""       # the capacity kept after those failures (T12)
  max_single_component_share: ""  # K_fd: the largest share of job-bearing capacity that any one component's failure may remove

S11_recovery_objective:           # one entry per failure class (T33): how the fabric recovers, and how fast
  - failure_class: ""
    mechanism: ""                 # how the fabric recovers: routing-convergence | nic-multipath-or-spraying | job-restart
    time_to_restore_capacity: ""  # how long until the designed capacity is back
    routing_convergence_time: ""  # where routing is the mechanism: how long routing takes to settle on new paths (measured as M45)
    tolerated_job_impact: ""      # what a running job is allowed to suffer: continue | degrade | restart

# ---------------------------------------------------------------- Availability
S12_availability_target:
  healthy_share_of_windows: ""    # "healthy X% of the time": the share of scoring windows in which the score is healthy and no critical condition is active. See SPEC.md §9.2.
  period: ""                      # the period the share is measured over
  declared_maintenance_counts_against_target: ""   # yes | no: whether windows inside declared maintenance count against the target. See SPEC.md §9.3.

# ---------------------------------------------------------------- Performance envelope
S13_bandwidth_per_accelerator: "" # the designed scale-out bandwidth each accelerator is built to have
S14_collective_bandwidth_reference: []  # the promised bus bandwidth per (collective, message size, rank count) cell, measured by method M-D7 (T26)
S15_tail_delay_budget: []               # the promised tail delay per path class, loaded and unloaded, measured by method M-DLY (T10)
S16_loss_budget: {}                     # the promised loss per cause and traffic class, and NIC retransmission rates (T4)
S17_pause_budget: {}                    # the promised PFC pause-time fraction per priority and port (T3)
S18_physical_layer_budgets:             # per PHY type (the physical layer of a link: its optics or copper and signalling); never laxer than the IEEE (Institute of Electrical and Electronics Engineers) budget (T37), the Ethernet standard's fixed floor
  - phy_type: ""
    stricter_budget: ""                 # optional: a budget tighter than the IEEE one
    early_warning_margin: ""            # optional: an early-warning margin, stricter than the budget (T5)

# ---------------------------------------------------------------- Required tests and telemetry
S19_required_tests:
  synthetic_collectives_required: ""    # yes | no: whether AI communication testing with synthetic collectives (D7) is required
  collective_cadence: ""                # K_cad: how often the collective tests run (within the Rulebook frequency bound)
  test_duration: ""                     # K_d7dur: how long each test run lasts (within the Rulebook bound)
  test_nodes: ""                        # the small reserved node set the tests run on (K_d7nodes), or scheduled gaps
  conformance_test_cadence: ""          # K_conf: how often the conformance outcome tests run

S20_telemetry_profile_ref: ""           # where the telemetry profile is kept: the metrics exported per entity class; it must cover the Rulebook minimum for the class (T35)

# ---------------------------------------------------------------- Class
S21_declared_class: ""                  # R1 | R2 | R3 (the class presets) or CUSTOM. See SPEC_SHEET.md §5.
