name: Build Fabric Vitals v0.2 PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Rebuild accepted v0.2 PDFs
        run: |
          python paper/build_fv_pdfs.py paper paper/Fabric_Vitals_Paper_v0.2.md paper/Fabric_Vitals_Paper_v0.2.pdf
          python paper/build_fv_pdfs.py simple paper/Fabric_Vitals_Summary_v0.2.md paper/Fabric_Vitals_Summary_v0.2.pdf
          python paper/build_fv_pdfs.py simple paper/Fabric_Vitals_FAQ_v0.2.md paper/Fabric_Vitals_FAQ_v0.2.pdf

      - name: Commit rebuilt PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/Fabric_Vitals_Paper_v0.2.pdf paper/Fabric_Vitals_Summary_v0.2.pdf paper/Fabric_Vitals_FAQ_v0.2.pdf
          if git diff --cached --quiet; then
            echo "PDFs already synchronized."
          else
            git commit -m "Rebuild Fabric Vitals v0.2 PDFs"
            git push
          fi
